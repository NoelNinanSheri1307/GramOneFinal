# Ruff lint configuration for the GramOne backend.
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI standard: Depends(...) as an argument default
    "BLE001", # deliberate catch-all when probing DB connectivity in /health
]